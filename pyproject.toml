[project]
name = "mcp-trading-floor"
version = "0.1.0"
description = "Four autonomous trader agents running on six MCP servers, with a live Gradio dashboard"
requires-python = ">=3.12"
dependencies = [
    # Agent framework
    "openai-agents[viz]>=0.15.1",
    "openai>=2.34.0",

    # MCP — pinned below v2. The v2 release renamed McpError -> MCPError and moved
    # mcp.server.fastmcp, which breaks the FastMCP servers in backend/ and several
    # community MCP servers this project launches over stdio.
    "mcp<2",

    # Market data
    "massive>=2.8.0",

    # Dashboard
    "gradio>=6.14.0",
    "plotly>=6.8.0",
    "pandas>=2.2.0",

    # Support
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]

[tool.uv]
package = false
